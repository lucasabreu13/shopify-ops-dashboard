<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopify Ops Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="./src/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg border-bottom bg-white sticky-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-semibold" href="#">Shopify Ops</a>
        <div class="d-flex align-items-center gap-2">
          <span class="badge text-bg-light border">Hoje</span>
          <button class="btn btn-sm btn-dark" id="refreshButton" type="button">
            <i class="bi bi-arrow-clockwise"></i>
            Atualizar
          </button>
        </div>
      </div>
    </nav>

    <main class="container-fluid px-4 py-4">
      <section class="row g-3 mb-4" id="kpiGrid" aria-label="Indicadores"></section>

      <section class="row g-4">
        <div class="col-12 col-xl-8">
          <div class="panel h-100">
            <div class="panel-header">
              <div>
                <h1>Pedidos recentes</h1>
                <p>Visao operacional de pedidos, status e ticket medio.</p>
              </div>
              <select class="form-select form-select-sm status-filter" id="statusFilter" aria-label="Filtrar status">
                <option value="all">Todos</option>
                <option value="paid">Pagos</option>
                <option value="pending">Pendentes</option>
                <option value="refunded">Estornados</option>
              </select>
            </div>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th>Pedido</th>
                    <th>Cliente</th>
                    <th>Status</th>
                    <th>Canal</th>
                    <th class="text-end">Total</th>
                  </tr>
                </thead>
                <tbody id="ordersTable"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-12 col-xl-4">
          <div class="panel mb-4">
            <div class="panel-header">
              <div>
                <h2>Estoque critico</h2>
                <p>Produtos abaixo do ponto de reposicao.</p>
              </div>
            </div>
            <div id="inventoryAlerts" class="stack"></div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <div>
                <h2>Top produtos</h2>
                <p>Itens com maior receita no periodo.</p>
              </div>
            </div>
            <div id="topProducts" class="stack"></div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
